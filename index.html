<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jasmine - Developer & Dreamer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <div class="background-overlay"></div>
    <div id="particles-container"></div>

    <div class="top-right-controls">
        <button id="settingsToggle" class="settings-btn" title="设置">
            <i class="fa-solid fa-gear"></i>
        </button>
        <div class="settings-menu" id="settingsMenu">
            <div class="settings-item" id="themeToggle">
                <i class="fa-solid fa-sun"></i>
                <span>白天模式</span>
            </div>
            <div class="settings-item" id="musicToggle">
                <i class="fa-solid fa-music"></i>
                <span>播放音乐</span>
            </div>
        </div>
    </div>

    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <div class="glass-card">
        <div class="top-modules">
            <div class="module-item" data-module="home">
                <i class="fa-solid fa-house"></i>
                <span>首页</span>
            </div>
            <div class="module-item" data-module="projects">
                <i class="fa-solid fa-code"></i>
                <span>项目作品</span>
            </div>
            <div class="module-item" data-module="study">
                <i class="fa-solid fa-book"></i>
                <span>学习笔记</span>
            </div>
            <div class="module-item" data-module="life">
                <i class="fa-solid fa-feather"></i>
                <span>生活笔记</span>
            </div>
            <div class="module-item" data-module="software">
                <i class="fa-solid fa-download"></i>
                <span>软件分享</span>
            </div>
            <div class="module-item" data-module="secret">
                <i class="fa-solid fa-lock"></i>
                <span>秘密小屋</span>
            </div>
        </div>
        <main class="main-container">
            <section id="home" class="nav-section active">
                <div class="profile-content">
                    <div class="avatar-wrapper">
                        <img src="images/avatar.jpg?v=2" onerror="this.onerror=null; this.src='images/avatar1.png?v=2';" alt="Jasmine Avatar" class="avatar">
                        <div class="status-dot"></div>
                    </div>

                    <h1 class="name">Jasmine</h1>
                    <h2 class="subtitle">Developer & Dreamer</h2>

                    <p class="quote">"You are my dream of gain and loss, and I am dispensable to you."</p>

                    <div class="social-links">
                        <a href="https://github.com/Ryker-Zhong" target="_blank" class="social-icon" title="GitHub">
                            <i class="fa-brands fa-github"></i>
                        </a>
                        <a href="javascript:void(0)" class="social-icon qr-trigger" title="WeChat">
                            <i class="fa-brands fa-weixin"></i>
                            <img src="images/wechat.jpg" alt="WeChat QR" class="qr-popup">
                        </a>
                        <a href="javascript:void(0)" class="social-icon qr-trigger" title="QQ">
                            <i class="fa-brands fa-qq"></i>
                            <img src="images/qq.jpg" alt="QQ QR" class="qr-popup">
                        </a>
                        <a href="#" id="email-icon-link" class="social-icon" title="Email">
                            <i class="fa-regular fa-envelope"></i>
                        </a>
                    </div>
                </div>
            </section>

            <section id="section-projects" class="nav-section content-section">
                <h2 class="section-title"><i class="fa-solid fa-code"></i> 项目作品</h2>
                <div class="content-grid" id="projects-grid"></div>
            </section>
            <section id="section-study" class="nav-section content-section">
                <h2 class="section-title"><i class="fa-solid fa-book"></i> 学习笔记</h2>
                <div class="content-grid" id="study-grid"></div>
            </section>
            <section id="section-life" class="nav-section content-section">
                <h2 class="section-title"><i class="fa-solid fa-feather"></i> 生活笔记</h2>
                <div class="content-grid" id="life-grid"></div>
            </section>
            <section id="section-software" class="nav-section content-section">
                <h2 class="section-title"><i class="fa-solid fa-download"></i> 软件分享</h2>
                <div class="content-grid" id="software-grid"></div>
            </section>
            <section id="section-secret" class="nav-section content-section">
                <h2 class="section-title"><i class="fa-solid fa-lock"></i> 秘密小屋</h2>
                <div class="content-grid" id="secret-grid"></div>
            </section>
        </main>

        <footer class="footer">
            赣ICP备2026005556号
           © 2026-2029 JASMINE-ZHONG
        </footer>
    </div>

    <div id="email-modal" class="modal-overlay">
        <div class="modal-box email-box">
            <h3 class="modal-title" style="text-align: center; margin-bottom: -0.5rem;">
                <i class="fa-solid fa-envelope-open-text"></i> 联系邮箱
            </h3>
            <div class="email-display">
                <span id="email-text">3127737156@qq.com</span>
            </div>
            <p class="email-desc" style="text-align: center;">期待与您的交流，您可以点击下方按钮立刻复制此邮箱地址！</p>
            <div class="modal-actions" style="justify-content: center; margin-top: 1rem; gap: 1rem;">
                <button class="btn-cancel" id="close-email-btn" style="flex: 1;">关闭</button>
                <button id="copy-email-btn" class="btn-confirm"
                    style="flex: 1.5; background: rgba(255, 255, 255, 0.1); color: white; border: 1px solid rgba(255,255,255,0.2);">
                    <i class="fa-regular fa-copy"></i> 复制地址
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
